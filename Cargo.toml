[package]
name = "hot_cheese"
version = "0.1.1"
edition = "2021"

[dependencies]
err_mac = { git = "https://github.com/copiumnicus/err_mac.git", rev = "08f6335" }
scrypt = { version = "0.10.0" }
aes = "0.8.0"
ctr = "0.9.0"
k256 = { version = "0.13.1", default-features = false, features = [
    "ecdsa",
    "std",
] }
serde = { version = "1.0.217", features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
rand = "0.8.5"
serde_json = "1.0.134"
zeroize = "1.8.1"

tokio = { version = "1.42.0", features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
] }
rustls-pemfile = "2"
pki-types = { package = "rustls-pki-types", version = "1" }
http = "1"
hyper = { version = "1", default-features = false }
# hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "tokio"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "server-auto",
    "tokio",
] }
rustls = { version = "0.23", default-features = false, features = [
    "tls12",
    "ring",
] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false }

objc = "0.2.7"
block = "0.1.6"
dispatch = "0.2.0"
df-share = "0.1.1"
solana-keypair = "2.2.1"
solana-signer = "2.2.1"
bs58 = "0.5.1"

# --- v1: Secure Enclave envelope (DEK/KEK), KDFs, AEAD, CLI, certs ---
chacha20poly1305 = "0.10" # XChaCha20-Poly1305 AEAD for keystores + DEK wrapping
hkdf = "0.12"             # derive wrap key from SE ECDH shared secret (0.12 = hmac 0.12/digest 0.10, aligned with k256 stack)
sha2 = "0.10"             # MUST stay 0.10 to share `digest` with k256/keccak stack
argon2 = "0.5"                                       # recovery-passphrase KEK (Argon2id)
p256 = { version = "0.13", features = ["ecdh"] }     # ephemeral keys + ECIES for bootstrap
hex = { version = "0.4", features = ["serde"] }
rcgen = "0.14"            # generate self-signed localhost cert on `init`
clap = { version = "4", features = ["derive"] }
rpassword = "7.3.1"       # passphrase prompts (was dev-only)
tracing = "0.1"
tracing-subscriber = "0.3"
security-framework = "3.7" # Secure Enclave key + ECDH (Touch ID bound)
core-foundation = "0.10"

[dev-dependencies]
ureq = "2.12.1"


[[bin]]
name = "hot_cheese"
path = "src/main.rs"

# The Tauri menu-bar app lives in its own crate so the core dev loop stays fast.
# `cargo build`/`cargo test` at the root build only this package (the lib+bin);
# build the app explicitly with `cargo build -p hot_cheese_app`.
[workspace]
members = ["app/src-tauri"]
