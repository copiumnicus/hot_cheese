[package]
name = "hot_cheese"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
err_mac = { git = "https://github.com/copiumnicus/err_mac.git", rev = "08f6335" }
scrypt = { version = "=0.10.0" }
aes = "=0.8.4"
ctr = "=0.9.2"
k256 = { version = "=0.13.4", default-features = false, features = [
    "ecdsa",
    "std",
] }
serde = { version = "=1.0.228", features = ["derive"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
rand = "=0.8.5"
serde_json = "=1.0.137"
toml = "=0.8.2"
zeroize = "=1.8.1"

tokio = { version = "=1.42.0", features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
] }
rustls-pemfile = "=2.2.0"
pki-types = { package = "rustls-pki-types", version = "=1.10.1" }
http = "=1.2.0"
hyper = { version = "=1.10.1", default-features = false, features = [
    "client",
    "http1",
] }
hyper-util = { version = "=0.1.20", default-features = false, features = [
    "server-auto",
    "tokio",
] }
rustls = { version = "=0.23.20", default-features = false, features = [
    "tls12",
    "ring",
] }
http-body-util = "=0.1.2"
tokio-rustls = { version = "=0.26.1", default-features = false }

objc = "=0.2.7"
block = "=0.1.6"
dispatch = "=0.2.0"
df-share = "=0.1.1"
solana-keypair = "=2.2.1"
solana-signer = "=2.2.1"
bs58 = "=0.5.1"

chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
sha2 = "=0.10.8"
argon2 = "=0.5.3"
p256 = { version = "=0.13.2", features = ["ecdh"] }
hex = { version = "=0.4.3", features = ["serde"] }
rcgen = "=0.14.8"
clap = { version = "=4.5.60", features = ["derive"] }
rpassword = "=7.3.1"
tracing = "=0.1.41"
tracing-subscriber = "=0.3.20"
inquire = { version = "=0.9.4", default-features = false, features = [
    "crossterm",
] }
crossterm = "=0.29.0"
parking_lot = "=0.12.3"
hashbrown = "=0.15.5"

alloy-primitives = { version = "=0.8.26", features = ["serde"] }
alloy-sol-types = "=0.8.26"

[dev-dependencies]
ureq = "=2.12.1"


[[bin]]
name = "hot_cheese"
path = "src/main.rs"
