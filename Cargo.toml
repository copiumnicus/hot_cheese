[workspace]
resolver = "2"
members = [
    "crates/err-mac",
    "crates/hc-core",
    "crates/hc-sign",
    "crates/hc-bundle",
    "crates/hc-daemon",
    "crates/hc-console",
    "crates/hc-cli",
    "crates/hc-mcp",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false

[profile.release]
# Security-sensitive size, offset, counter, and cost arithmetic must never silently wrap merely
# because the optimized profile is in use. Hot paths that intentionally wrap use explicit APIs.
overflow-checks = true

[workspace.dependencies]
hc-core = { path = "crates/hc-core" }
hc-sign = { path = "crates/hc-sign" }
hc-bundle = { path = "crates/hc-bundle" }
hc-daemon = { path = "crates/hc-daemon" }
hc-console = { path = "crates/hc-console" }

err_mac = { path = "crates/err-mac" }
scrypt = { version = "=0.10.0" }
aes = "=0.8.4"
aes-gcm = "=0.10.3"
ctr = "=0.9.2"
k256 = { version = "=0.13.4", default-features = false, features = [
    "ecdsa",
    "std",
] }
serde = { version = "=1.0.228", features = ["derive"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
rand = "=0.8.6"
serde_json = "1"
toml = "=0.8.2"
zeroize = { version = "=1.8.1", features = ["derive"] }

tokio = { version = "=1.52.3", features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
] }
pki-types = { package = "rustls-pki-types", version = "=1.14.1" }
http = "=1.2.0"
hyper = { version = "=1.10.1", default-features = false, features = [
    "client",
    "http1",
] }
hyper-util = { version = "=0.1.20", default-features = false, features = [
    "server-auto",
    "tokio",
] }
rustls = { version = "=0.23.40", default-features = false, features = [
    "tls12",
    "ring",
] }
http-body-util = "=0.1.2"
tokio-rustls = { version = "=0.26.4", default-features = false }

ring = "=0.17.14"
subtle = "=2.6.1"
bs58 = "=0.5.1"

chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
argon2 = "=0.5.3"
p256 = { version = "=0.13.2", features = ["ecdh"] }
hex = { version = "=0.4.3", features = ["serde"] }
rcgen = "=0.14.8"
clap = { version = "=4.5.60", features = ["derive"] }
rpassword = "=7.3.1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.20"
inquire = { version = "=0.9.4", default-features = false, features = [
    "crossterm",
] }
crossterm = "=0.29.0"
parking_lot = "=0.12.3"
hashbrown = { version = "=0.15.5", features = ["serde"] }
libc = "=0.2.186"
qrcode = { version = "=0.14.1", default-features = false }

alloy-primitives = { version = "=0.8.26", features = ["serde"] }
alloy-sol-types = "=0.8.26"
alloy-dyn-abi = { version = "=0.8.26", features = ["eip712"] }
alloy-json-abi = "=0.8.26"

ureq = "=2.12.1"
