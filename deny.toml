[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained proc-macro via alloy-primitives/alloy-sol-types; compile-time only; pending upstream alloy migration" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1 unmaintained via alloy-sol-macro; compile-time only; pending upstream alloy migration" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "hashbrown@0.15.5", reason = "alloy-primitives 0.8.26 pins hashbrown 0.15; indexmap 2.14 uses 0.17; removing needs an alloy bump" },
    { crate = "password-hash@0.4.2", reason = "legacy Web3-keystore import uses scrypt 0.10/password-hash 0.4; the envelope recovery path uses argon2 0.5/password-hash 0.5" },
    { crate = "syn@3.0.3", reason = "tokio-macros 2.7 has migrated to syn 3 while the remaining proc macros still use syn 2; compile-time only" },
    { crate = "winnow@0.5.40", reason = "toml 0.8.2 uses winnow 0.5 while Alloy's runtime ABI parser uses winnow 0.7; removal requires coordinated parser upgrades" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
